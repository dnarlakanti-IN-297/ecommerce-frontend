[pytest]
# Pytest configuration for ecommerce-frontend

# Repo root on sys.path so `from app import app` resolves under a bare
# `pytest` invocation (not just `python -m pytest`) - tests/ has no
# __init__.py, so pytest's own basedir walk stops there otherwise.
pythonpath = .

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short

# Coverage settings
[coverage:run]
source = .
omit =
    */tests/*
    */test_*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
