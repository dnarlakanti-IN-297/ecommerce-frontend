apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Frontend Deploy

on:
  workflow_call:
    inputs:
      artifact-id:
        type: string
        required: true
        description: "Docker image tag (Git SHA) to deploy"
      environment:
        type: string
        required: true
        description: "Target environment (dev, staging, prod)"
      kubeconfig:
        type: string
        required: true
        description: "Kubernetes config for cluster access"

jobs:
  deploy-frontend:
    environment: ${{ inputs.environment }}
    env:
      IMAGE_TAG: ${{ inputs.artifact-id }}
      ENVIRONMENT: ${{ inputs.environment }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout infra repo
        uses: cloudbees-io/checkout@v1
        with:
          repository: dnarlakanti-IN-297/ecommerce-infra
          ref: main

      - name: Configure kubectl
        uses: docker://alpine:latest
        shell: sh
        run: |
          apk add --no-cache curl
          curl -LO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && mv kubectl /usr/local/bin/
          mkdir -p ~/.kube
          echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config
          kubectl cluster-info
        env:
          KUBECONFIG_BASE64: ${{ inputs.kubeconfig }}

      - name: Create namespace if not exists
        uses: docker://alpine:latest
        shell: sh
        run: |
          apk add --no-cache curl
          curl -LO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && mv kubectl /usr/local/bin/
          mkdir -p ~/.kube
          echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config

          case "$ENVIRONMENT" in
            dev) NAMESPACE="ecommerce-dev" ;;
            staging) NAMESPACE="ecommerce-staging" ;;
            prod) NAMESPACE="ecommerce-prod" ;;
            *) echo "❌ Unknown environment: $ENVIRONMENT"; exit 1 ;;
          esac

          kubectl get namespace $NAMESPACE || kubectl create namespace $NAMESPACE
          echo "✅ Namespace $NAMESPACE ready"
        env:
          KUBECONFIG_BASE64: ${{ inputs.kubeconfig }}

      - name: Cleanup old Helm releases
        uses: docker://alpine/helm:latest
        shell: sh
        run: |
          apk add --no-cache curl
          curl -LO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && mv kubectl /usr/local/bin/
          mkdir -p ~/.kube
          echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config

          case "$ENVIRONMENT" in
            dev) NAMESPACE="ecommerce-dev" ;;
            staging) NAMESPACE="ecommerce-staging" ;;
            prod) NAMESPACE="ecommerce-prod" ;;
          esac

          helm uninstall ecommerce -n $NAMESPACE 2>/dev/null || true
          echo "✅ Cleanup done"
        env:
          KUBECONFIG_BASE64: ${{ inputs.kubeconfig }}

      - name: Deploy frontend with Helm
        uses: docker://alpine/helm:latest
        shell: sh
        run: |
          apk add --no-cache curl
          curl -LO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && mv kubectl /usr/local/bin/
          mkdir -p ~/.kube
          echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config

          case "$ENVIRONMENT" in
            dev) NAMESPACE="ecommerce-dev" ;;
            staging) NAMESPACE="ecommerce-staging" ;;
            prod) NAMESPACE="ecommerce-prod" ;;
          esac

          echo "🚀 Deploying frontend version: $IMAGE_TAG"
          echo "📍 Environment: $ENVIRONMENT"
          echo "📦 Namespace: $NAMESPACE"

          VALUES_FILE="helm/ecommerce-frontend/values-${ENVIRONMENT}.yaml"
          if [ ! -f "$VALUES_FILE" ]; then
            VALUES_FILE="helm/ecommerce-frontend/values.yaml"
          fi

          helm upgrade --install ecommerce-frontend ./helm/ecommerce-frontend \
            --namespace $NAMESPACE \
            --values $VALUES_FILE \
            --set image.repository=$DOCKERHUB_USERNAME/ecommerce-frontend \
            --set image.tag=latest \
            --timeout 10m

          echo "✅ Frontend deployment successful!"
        env:
          KUBECONFIG_BASE64: ${{ inputs.kubeconfig }}

      - name: Verify frontend deployment
        uses: docker://alpine:latest
        shell: sh
        run: |
          apk add --no-cache curl
          curl -LO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && mv kubectl /usr/local/bin/
          mkdir -p ~/.kube
          echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config

          case "$ENVIRONMENT" in
            dev) NAMESPACE="ecommerce-dev" ;;
            staging) NAMESPACE="ecommerce-staging" ;;
            prod) NAMESPACE="ecommerce-prod" ;;
          esac

          echo "📊 Checking frontend pods..."
          kubectl get pods -n $NAMESPACE -l tier=frontend

          kubectl rollout status deployment/ecommerce-frontend -n $NAMESPACE --timeout=300s || {
            echo "❌ Deployment failed. Pod details:"
            kubectl describe pods -n $NAMESPACE -l tier=frontend
            echo "--- Pod logs ---"
            kubectl logs -n $NAMESPACE -l tier=frontend --tail=50
            exit 1
          }

          echo "✅ Frontend is running!"
        env:
          KUBECONFIG_BASE64: ${{ inputs.kubeconfig }}
